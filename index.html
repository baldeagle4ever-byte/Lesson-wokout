<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية النسر - صفحة البداية</title>
    <style>
        body {
            background-color: #1a2a33;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #243441;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 90%;
        }
        .logo { width: 80px; margin-bottom: 20px; }
        h1 { color: #ffad33; font-size: 24px; margin-bottom: 10px; }
        p { color: #cfd8dc; margin-bottom: 30px; }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn-blue { background-color: #34ace0; color: white; }
        .btn-orange { background-color: #ff9f43; color: white; }
        .btn-green { background-color: #2ed573; color: white; }
        .btn:hover { transform: scale(1.05); filter: brightness(1.1); }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.png" alt="شعار أكاديمية النسر" class="logo">
        <h1>أكاديمية النسر</h1>
        <p>مرحباً بك في منصة الاختبارات والمراجعات الذكية</p>
        
        <a href="exam.html" class="btn btn-blue">مراجعة الحصة الأولى</a>
        <a href="review2.html" class="btn btn-orange">مراجعة الحصة الثانية</a>
        <a href="review3.html" class="btn btn-green">مراجعة الحصة الثالثة (Word)</a>
    </div>

</body>
</html>

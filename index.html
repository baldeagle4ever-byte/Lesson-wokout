<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية النسر - منصة الامتحانات</title>
    <style>
        body {
            background-color: #1a2a36;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #243b4d;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            border: 1px solid #344e64;
        }
        .logo {
            font-size: 50px;
            margin-bottom: 10px;
        }
        h1 {
            color: #ffcc00;
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 15px;
        }
        p {
            color: #cedde9;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .exam-btn {
            background-color: #38bdf8;
            color: #0f172a;
            font-size: 20px;
            font-weight: bold;
            padding: 15px 25px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }
        .exam-btn:hover {
            background-color: #0ea5e9;
            transform: translateY(-2px);
        }
        .exam-btn.secondary {
            background-color: #ff9f43;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(255, 159, 67, 0.3);
        }
        .exam-btn.secondary:hover {
            background-color: #ee5253;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">🦅</div>
        <h1>مرحباً بكم في أكاديمية النسر للتدريب والتعليم التقني</h1>
        <p>الرجاء اختيار الامتحان الذي تود البدء فيه للمراجعة وممارسة ما تعلمته:</p>
        
        <div class="button-container">
            <!-- Link to Exam 1 -->
            <a href="مراجعة.html" class="exam-btn">📝 بدء الامتحان الأول (المراجعة)</a>
            
            <!-- Link to Exam 2 -->
            <a href="exam.html" class="exam-btn secondary">💻 بدء الامتحان الثاني (امتحان تفاعلي)</a>
        </div>
    </div>

</body>
</html>

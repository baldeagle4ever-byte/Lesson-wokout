<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكاة إجرائية PowerPoint - أكاديمية النسر</title>
    <style>
        body { background-color: #1a2a33; color: white; font-family: 'Segoe UI', sans-serif; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .quiz-container { max-width: 800px; width: 100%; background: #243441; padding: 35px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header { text-align: center; border-bottom: 2px solid #b7472a; padding-bottom: 15px; margin-bottom: 20px; }
        .header h2 { color: #ffad33; margin: 5px 0; }
        .question-box { display: none; }
        .question-box.active { display: block; }
        .scenario { background: #2c3e50; padding: 15px; border-radius: 8px; border-right: 4px solid #b7472a; font-size: 15px; color: #b0bec5; margin-bottom: 15px; line-height: 1.5; }
        .question-text { font-size: 18px; font-weight: bold; margin-bottom: 15px; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option { background: #2c3e50; padding: 14px 18px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; font-size: 15px; }
        .option:hover { background: #34495e; }
        .option.correct { background: #2ed573 !important; border-color: #26af5f; }
        .option.wrong { background: #ff4757 !important; border-color: #d63031; }
        .btn { background-color: #ff9f43; color: white; border: none; padding: 10px 25px; border-radius: 20px; cursor: pointer; display: none; margin-top: 15px; font-weight: bold; }
        .result-view { display: none; text-align: center; }
        .home-btn { display: inline-block; margin-top: 20px; background-color: #34ace0; color: white; padding: 10px 25px; border-radius: 20px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h2>📉 محاكاة الإجراءات التطبيقية: Microsoft PowerPoint</h2>
        <p id="counter">السؤال 1 من 5</p>
    </div>

    <div id="quiz-body">
        <div id="question-place"></div>
        <button class="btn" id="next-btn" onclick="nextQ()">السؤال التالي ◀</button>
    </div>

    <div id="result-body" class="result-view">
        <h3>📊 النتيجة النهائية لمحاكاة PowerPoint</h3>
        <p id="score-text" style="font-size: 22px; font-weight: bold; color: #ffad33;"></p>
        <p id="feedback" style="color: #cfd8dc;"></p>
        <a href="index.html" class="home-btn">🏠 العودة للرئيسية</a>
    </div>
</div>

<script>
    const pptQuestions = [
        {
            scenario: "🎞️ قمت بإنهاء تصميم العرض التقديمي، وتريد الآن ضبط تأثير بصري حركي يظهر عند انتقال العرض التلقائي من الشريحة رقم 1 إلى الشريحة رقم 2 (مثل تأثير التلاشي أو التداخل).",
            q: "🤔 ما هو التبويب الإجرائي الصحيح لتطبيق حركة الانتقال بين الشرايح كاملة؟",
            options: [
                "🔲 تبويب (حركات Animations)",
                "✅ تبويب (انتقالات Transitions)",
                "🔲 تبويب (تصميم Design)",
                "🔲 تبويب (إدراج Insert)"
            ],
            correct: 1
        },
        {
            scenario: "✏️ داخل الشريحة الحالية، قمت بإدراج عنوان نصي وصورة وتريد جعل الصورة تظهر وتتحرك وحدها للداخل (مثل حركة الوثب الفردية) بعد ظهور العنوان عند النقر بالفأرة.",
            q: "🤔 ما هو التبويب الإجرائي المخصص لتطبيق حركة فرعية على عنصر محدد ومستقل داخل الشريحة؟",
            options: [
                "🔲 تبويب (انتقالات Transitions)",
                "🔲 تبويب (عرض الشرائح Slide Show)",
                "✅ تبويب (حركات Animations)",
                "🔲 تبويب (تنسيق الصفحة)"
            ],
            correct: 2
        },
        {
            scenario: "🖥️ تريد بدء العرض التقديمي الفعلي والكامل أمام اللجنة على شاشة الإسقاط الكبيرة من أول شريحة في الملف باستخدام اختصار لوحة المفاتيح المباشر دون البحث في القوائم.",
            q: "🤔 ما هو الزر السريع المخصص لبدء العرض من الشريحة الأولى مباشرة؟",
            options: [
                "🔲 زر الاختصار F1",
                "✅ زر الاختصار F5",
                "🔲 زر الاختصار Ctrl + Enter",
                "🔲 زر الاختصار Alt + F4"
            ],
            correct: 1
        },
        {
            scenario: "🗂️ قمت بتصميم 15 شريحة، وتريد تغيير الواجهة التنظيمية للبرنامج لتظهر جميع الشرائح مصغرة معاً في شاشة واحدة لتسهيل إعادة ترتيبها باليد والسحب.",
            q: "🤔 ما هو خيار العرض الإجرائي المناسب للقيام بفرز وترتيب الشرائح؟",
            options: [
                "🔲 تبويب (إدراج) واختيار ألبوم صور فوتوغرافية",
                "✅ تبويب (عرض View) ➡️ مجموعة (طرق عرض العروض التقديمية) ➡️ اختيار (فارس الشرائح Slide Sorter)",
                "🔲 تبويب تصميم واختيار اتجاه الشريحة العمودي",
                "🔲 الضغط المطول على زر الهروب Esc"
            ],
            correct: 1
        },
        {
            scenario: "🎨 تريد تغيير الخلفية والمظهر البصري العام لجميع الشرائح دفعة واحدة لتبدو بتصميم احترافي موحد مدمج من قوالب مايكروسوفت الجاهزة.",
            q: "🤔 ما هو التبويب المسؤول عن تغيير نسق وثيمات العرض التقديمي؟",
            options: [
                "✅ تبويب (تصميم Design) ➡️ ثم اختيار أحد النسق المتوفرة في مجموعة (Themes)",
                "🔲 تبويب (الصفحة الرئيسية) واختيار النمط العادي للفقرة",
                "🔲 تبويب (مراجعة) واختيار ميزة الترجمة الفورية للشرائح",
                "🔲 قائمة ملف واختيار إغلاق الحزمة الكاملة"
            ],
            correct: 0
        }
    ];

    let currentIdx = 0;
    let score = 0;

    function renderQ() {
        document.getElementById('counter').innerText = `السؤال ${currentIdx + 1} من ${pptQuestions.length}`;
        document.getElementById('next-btn').style.display = 'none';
        
        const qData = pptQuestions[currentIdx];
        const container = document.getElementById('question-place');
        
        let optsHtml = '';
        qData.options.forEach((opt, index) => {
            optsHtml += `<div class="option" onclick="checkAnswer(this, ${index})">${opt}</div>`;
        });

        container.innerHTML = `
            <div class="question-box active">
                <div class="scenario">${qData.scenario}</div>
                <div class="question-text">${qData.q}</div>
                <div class="options">${optsHtml}</div>
            </div>
        `;
    }

    function checkAnswer(element, index) {
        const qData = pptQuestions[currentIdx];
        const options = element.parentElement.getElementsByClassName('option');
        
        for(let opt of options) { opt.style.pointerEvents = 'none'; }

        if(index === qData.correct) {
            element.classList.add('correct');
            score++;
        } else {
            element.classList.add('wrong');
            options[qData.correct].classList.add('correct');
        }
        document.getElementById('next-btn').style.display = 'inline-block';
    }

    function nextQ() {
        currentIdx++;
        if(currentIdx < pptQuestions.length) {
            renderQ();
        } else {
            document.getElementById('quiz-body').style.display = 'none';
            document.getElementById('result-body').style.display = 'block';
            document.getElementById('score-text').innerText = `حصلت على: ${score} من ${pptQuestions.length}`;
            
            const feedback = document.getElementById('feedback');
            if(score === pptQuestions.length) {
                feedback.innerText = "🦅 أداء أسطوري مشرف جداً! متمكن من تسيير وهندسة العروض التقديمية وحركاتها بكفاءة بالغة.";
            } else if (score >= 3) {
                feedback.innerText = "👍 نتيجة طيبة تؤكد فهمك لأساسيات العرض والتحريك التقديمي بنجاح.";
            } else {
                feedback.innerText = "📚 مستواك يحتاج إلى مراجعة الفروق الجوهرية بين الانتقالات (بين الشرائح) والحركات (داخل الشريحة).";
            }
        }
    }

    window.onload = renderQ;
</script>
</body>
</html>

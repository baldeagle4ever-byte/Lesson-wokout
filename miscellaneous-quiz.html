<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيقات عامة - أكاديمية النسر</title>
    <style>
        body {
            background-color: #1a2a33;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .quiz-container {
            max-width: 850px;
            width: 100%;
            background: #243441;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #2c3e50;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .header h2 { color: #ffad33; margin: 5px 0; font-size: 24px; }
        .header p { color: #cfd8dc; font-size: 14px; margin: 5px 0 0 0; }
        .progress-bar {
            height: 6px;
            background-color: #1a2a33;
            border-radius: 3px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress {
            height: 100%;
            background-color: #ff9f43;
            width: 0%;
            transition: width 0.3s ease;
        }
        .question-box { display: none; }
        .question-box.active { display: block; }
        .question-text { font-size: 19px; font-weight: bold; margin-bottom: 20px; line-height: 1.6; }
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #2c3e50;
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            border: 2px solid transparent;
            font-size: 16px;
        }
        .option:hover { background: #34495e; }
        .option.correct { background: #2ed573 !important; border-color: #26af5f; color: white; }
        .option.wrong { background: #ff4757 !important; border-color: #d63031; color: white; }
        .actions { margin-top: 25px; text-align: left; }
        .btn {
            background-color: #ff9f43;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            display: none;
        }
        .results-window { display: none; text-align: center; padding: 20px; }
        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid #ffad33;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
        }
        .score-circle .num { font-size: 32px; font-weight: bold; color: #ffad33; }
        .home-btn {
            display: inline-block;
            margin-top: 25px;
            background-color: #34ace0;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
        }
        
        /* تنسيقات خاصة لحفظ التماسك وإخفاء العناصر عند الطباعة */
        .pdf-no-break { page-break-inside: avoid !important; break-inside: avoid !important; }
        .pdf-hide { display: none !important; }
        .pdf-print-block { display: block !important; margin-bottom: 20px; border-bottom: 1px solid #34495e; padding-bottom: 15px; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<div class="quiz-container" id="quiz-capture-zone">
    <div class="header">
        <h2>🎯 تطبيقات عامة وموسعة (حول التخزين والبرمجيات)</h2>
        <p id="question-counter">السؤال 1 من 20</p>
        
        <button onclick="downloadBlankQuizAsPDF()" class="home-btn" id="blankPdfBtn" style="background-color: #ff9f43; border: none; cursor: pointer; font-size: 14px; padding: 10px 20px; margin-top: 10px;">
            📥 تحميل التطبيق كنسخة بيضاء فارغة (PDF)
        </button>
    </div>

    <div class="progress-bar" id="progressArea">
        <div class="progress" id="progress-line"></div>
    </div>

    <div id="quiz-window">
        <div id="question-container"></div>
        <div class="actions">
            <button class="btn" id="next-button" onclick="nextQuestion()">التالي ◀</button>
        </div>
    </div>

    <div id="results-window" class="results-window">
        <h2>📊 النتيجة النهائية لاختبارك التطبيقي</h2>
        <div class="score-circle">
            <div class="num" id="final-score">0</div>
            <div style="font-size: 12px; color: #aaa;">من 20</div>
        </div>
        <p id="feedback-text" style="font-size: 18px; color: #cfd8dc; margin-bottom: 20px;"></p>
        
        <button onclick="downloadDoneQuizAsPDF()" class="home-btn" style="background-color: #2ed573; border: none; cursor: pointer; width: 100%; display: block; margin-bottom: 10px;">
            📄 تحميل كشف الإجابات والتقرير النهائي (PDF)
        </button>

        <a href="index.html" class="home-btn" id="homeReturnBtn">🏠 العودة للصفحة الرئيسية</a>
    </div>
</div>

<script>

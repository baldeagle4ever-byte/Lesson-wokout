<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراجعة النهائية قبل مسابقة الترقية 26 - أكاديمية النسر</title>
    <style>
        :root {
            --bg-main: #0b1329;
            --bg-card: #1c2541;
            --accent-gold: #eab308;
            --accent-cyan: #38bdf8;
            --success-green: #22c55e;
            --danger-red: #ef4444;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            box-sizing: border-box;
        }
        .quiz-container {
            max-width: 950px;
            width: 100%;
            background: var(--bg-card);
            padding: 25px;
            border-radius: 20px;
            border: 2px solid var(--accent-gold);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            box-sizing: border-box;
        }
        .top-header {
            text-align: center;
            border-bottom: 2px dashed #334155;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .top-header h1 {
            color: var(--accent-gold);
            font-size: 24px;
            margin: 5px 0;
            font-weight: 800;
        }
        .top-header p {
            color: var(--text-muted);
            font-size: 14px;
            margin: 5px 0 0 0;
        }
        .axis-badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-cyan);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 15px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: #0f172a;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }
        .metric-box span { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 2px;}
        .metric-box b { font-size: 15px; color: var(--text-light); }

        .progress-container {
            height: 6px;
            background: #0f172a;
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-gold));
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .question-text {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option {
            background: #222f54;
            padding: 14px 18px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 15px;
            border: 2px solid transparent;
        }
        .option.correct { background: var(--success-green) !important; color: white; font-weight: bold;}
        .option.wrong { background: var(--danger-red) !important; color: white; }
        
        .action-area { margin-top: 25px; text-align: left; }
        .nav-btn {
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 12px 35px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            display: none;
        }

        .final-panel { display: none; text-align: center; }
        .score-text { font-size: 28px; font-weight: 900; color: var(--accent-gold); margin: 15px 0; }
        
        .bottom-action-panel { width: 100%; max-width: 950px; margin-top: 15px; text-align: center; }
        .action-card-btn {
            display: block;
            width: 100%;
            background: var(--accent-gold);
            color: #0f172a;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }
        .back-link {
            display: inline-block;
            margin-top: 15px;
            background: #334155;
            color: white;
            padding: 10px 30px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
        }

        #print-section { display: none; }

        @media print {
            body { background: white !important; color: black !important; padding: 20px; display: block !important;}
            .quiz-container, .bottom-action-panel { display: none !important; }
            #print-section { display: block !important; }
            .print-item { page-break-inside: avoid; border-bottom: 1px solid #ccc; padding: 15px 0; }
            .print-opt { margin: 5px 0; padding: 6px; border: 1px solid #ddd; background: #fafafa; color: #000; }
            .print-correct { background: #dcfce7 !important; font-weight: bold; }
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="top-header">
        <h1>🦅 المراجعة النهائية قبل مسابقة الترقية 26</h1>
        <p>بنك الأسئلة الشامل والجامع لكافة المحاور والحصص التكوينية - أكاديمية النسر</p>
    </div>

    <div id="quiz-flow-area">
        <div style="text-align: center;">
            <div class="axis-badge" id="current-axis-title">المحور: عتاد وهندسة الحاسوب الأساسية</div>
        </div>

        <div class="metrics-grid">
            <div class="metric-box">
                <span>السؤال الحالي</span>
                <b><span id="live-index-text" style="color:var(--accent-gold);">1</span> / 52</b>
            </div>
            <div class="metric-box">
                <span>الإجابات الصحيحة</span>
                <b><span id="live-correct-text" style="color: var(--success-green);">0</span></b>
            </div>
            <div class="metric-box">
                <span>النسبة المئوية</span>
                <b><span id="live-percent-text" style="color: var(--accent-cyan);">0%</span></b>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress-indicator"></div>
        </div>

        <div id="dynamic-question-placeholder"></div>

        <div class="action-area">
            <button class="nav-btn" id="next-step-btn" onclick="advanceQuiz()">السؤال الموالي ◀</button>
        </div>
    </div>

    <div id="final-results-area" class="final-panel">
        <div style="font-size:50px;" id="medal-emoji">🏆</div>
        <h2>التقرير الختامي للمترشح</h2>
        <div class="score-text" id="total-score-render">النتيجة: 0 من 52</div>
        <p id="final-feedback-msg" style="font-size: 15px; color: var(--text-muted); line-height: 1.6;"></p>
        
        <button onclick="exportGradedPdf()" class="action-card-btn" style="background-color: var(--success-green); color: white; margin-top: 20px;">
            📄 استخراج وطباعة كشف مراجعتك التفصيلي المصحح (PDF)
        </button>
        <br>
        <a href="index.html" class="back-link">🏠 العودة إلى الصفحة الرئيسية</a>
    </div>
</div>

<div class="bottom-action-panel" id="lower-panel">
    <button onclick="exportBlankPdf()" class="action-card-btn" id="blankExportBtn">
        📥 تحميل بنك الأسئلة كاملاً كنسخة بيضاء فارغة للمراجعة الورقية (PDF)
    </button>
</div>

<div id="print-section"></div>

<script>
    const bank = [
        { axis: "عتاد وهندسة الحاسوب الأساسية", q: "ما هي الوحدة التخزينية المادية الأسرع مباشرة في استجابة معالج الحاسوب؟", options: ["الذاكرة الخبئية (Cache Memory)", "القرص الصلب (SSD)", "الذاكرة العشوائية (RAM)", "الفلاش ديسك (USB)"], correct: 0 },
        { axis: "عتاد وهندسة الحاسوب الأساسية", q: "أي من القطع التالية تُعد لوحة الربط الحيوية الأساسية التي تتصل بها كافة مكونات الحاسوب؟", options: ["لوحة الأم (Motherboard)", "مزود الطاقة (Power Supply)", "بطاقة الشاشة (GPU)", "صندوق الحاسوب"], correct: 0 },
        { axis: "عتاد وهندسة الحاسوب الأساسية", q: "ما هي الوظيفة المحورية لذاكرة ROM (ذاكرة القراءة فقط) بالحاسوب؟", options: ["حفظ نظام التشغيل بالكامل", "تخزين البرامج المكتبية المفعلة", "حفظ البرمجيات البدئية الأساسية للإقلاع واختبار العتاد الفوري (BIOS)", "مضاعفة سرعة الألعاب الرقمية"], correct: 2 },
        { axis: "عتاد وهندسة الحاسوب الأساسية", q: "الوظيفة الجوهرية لمعجون التبريد (Thermal Paste) الموضع فوق المعالج هي:", options: ["تنظيف المعالج من الأتربة", "سد الفراغات المجهرية لنقل الحرارة بكفاءة إلى المشتت الميكانيكي", "زيادة التردد الكهربائي للمعالج", "حماية نظام التشغيل من التجمد"], correct: 1 },
        { axis: "عتاد وهندسة الحاسوب الأساسية", q: "أي المكونات التالية يصنف كجهاز إدخال وإخراج للبيانات في نفس الوقت؟", options: ["شاشة اللمس (Touch Screen)", "الماسح الضوئي (Scanner)", "المكبرات الصوتية (Speakers)", "لوحة المفاتيح"], correct: 0 },
        { axis: "عتاد وهندسة الحاسوب الأساسية", q: "تُقاس سرعة معالجة البيانات وتنفيذ العمليات في وحدات الـ CPU الحديثة بوحدة:", options: ["الغيغابايت (GB)", "الغيغاهرتز (GHz)", "الميغابايت لكل ثانية", "البكسل الكلي (Pixel)"], correct: 1 },
        { axis: "عتاد وهندسة الحاسوب الأساسية", q: "عند ترقية مساحة القرص الصلب من نوع HDD التقليدي إلى نوع SSD، فإن الميزة المباشرة المحصلة هي:", options: ["زيادة أبعاد الشاشة تلقائياً", "ارتفاع هائل في سرعة قراءة وكتابة البيانات وإقلاع النظام", "توفير باقات إنترنت مجانية", "منع الفيروسات من الدخول تماماً"], correct: 1 },
        { axis: "عتاد وهندسة الحاسوب الأساسية", q: "الوحدة المسؤولة عن إجراء العمليات المنطقية والمقارنات (مثل أكبر أو أصغر) داخل المعالج هي:", options: ["وحدة التحكم (CU)", "المسجلات الداخلية", "وحدة الحساب والمنطق (ALU)", "الذاكرة المخبئية"], correct: 2 },
        
        { axis: "أنظمة التشغيل وتسيير الملفات", q: "ما هو الاختصار القياسي المستخدم لإغلاق أي نافذة برمجية أو تطبيق نشط فوراً في نظام Windows؟", options: ["Alt + F4", "Ctrl + F4", "Ctrl + Shift + Esc", "Shift + Delete"], correct: 0 },
        { axis: "أنظمة التشغيل وتسيير الملفات", q: "أي مما يلي يمثل نظام ملفات (File System) معتمد في أنظمة ويندوز الحديثة لتسيير وصلاحيات الأقراص؟", options: ["NTFS", "HTTP", "JPEG", "BIOS"], correct: 0 },
        { axis: "أنظمة التشغيل وتسيير الملفات", q: "حذف ملف بشكل نهائي وبدون المرور على سلة المهملات (Recycle Bin) يتطلب الضغط المدمج على:", options: ["Ctrl + Delete", "Shift + Delete", "Alt + Delete", "Tab + Delete"], correct: 1 },
        { axis: "أنظمة التشغيل وتسيير الملفات", q: "ما هو الامتداد الافتراضي للملفات النصية البسيطة والأساسية المنشأة عبر مفكرة ويندوز (Notepad)؟", options: [".docx", ".pdf", ".txt", ".html"], correct: 2 },
        { axis: "أنظمة التشغيل وتسيير الملفات", q: "أي البرامج التالية يعد المسؤول المباشر عن إدارة قطع العتاد الملحقة وتوافقها التام مع بيئة نظام التشغيل؟", options: ["برامج التعريفات (Drivers)", "برامج معالجة الملتيميديا", "حزم الجداول الحسابية", "متصفحات الويب المستقلة"], correct: 0 },
        { axis: "أنظمة التشغيل وتسيير الملفات", q: "ماذا تسمى العملية التي تقوم بإعادة تنظيم الملفات المبعثرة على القرص المغناطيسي لتسريع استجابة النظام؟", options: ["إلغاء التجزئة (Defragmentation)", "التهيئة السريعة (Formatting)", "النسخ الاحتياطي السحابي", "الضغط البرمجي للمجلدات"], correct: 0 },
        { axis: "أنظمة التشغيل وتسيير الملفات", q: "في نظام ويندوز، أين تقع الأداة المركزية التي تتيح تعديل اللغات، إدارة الحسابات، وإلغاء تثبيت البرامج من جذورها؟", options: ["لوحة التحكم (Control Panel / Settings)", "مجلد المستندات الشخصية", "ملف الإقلاع المحمي", "شريط المهام السفلي"], correct: 0 },

        { axis: "البرمجيات المكتبية وحزمة Office", q: "في Microsoft Word، الاختصار المسؤول عن محاذاة النص المظلل وتوسيطه في منتصف السطر هو:", options: ["Ctrl + E", "Ctrl + C", "Ctrl + L", "Ctrl + R"], correct: 0 },
        { axis: "البرمجيات المكتبية وحزمة Office", q: "أي الرموز التالية يظهر في خلايا Excel ليدل على أن محتوى الخلية أكبر من المساحة العرضية الحالية للعمود؟", options: ["#VALUE!", "#DIV/0!", "#####", "#NAME?"], correct: 2 },
        { axis: "البرمجيات المكتبية وحزمة Office", q: "ما هي الدالة الحسابية الصحيحة التي تُستخدم لمعرفة عدد الخلايا التي تحتوي على أرقام فقط ضمن نطاق معين في Excel؟", options: ["=COUNT()", "=COUNTA()", "=COUNTIF()", "=SUM()"], correct: 0 },
        { axis: "البرمجيات المكتبية وحزمة Office", q: "في برنامج PowerPoint، لإنشاء تأثير بصري حركي عند الانتقال من شريحة (Slide) إلى أخرى، نستخدم التبويب:", options: ["حركات (Animations)", "انتقالات (Transitions)", "تصميم (Design)", "عرض الشرائح"], correct: 1 },
        { axis: "البرمجيات المكتبية وحزمة Office", q: "الصيغة الافتراضية الصحيحة لحساب حاصل جمع الخلايا من B1 إلى B20 في جداول إكسيل هي:", options: ["=SUM(B1:B20)", "=ADD(B1-B20)", "=TOTAL(B1..B20)", "SUM(B1:B20)="], correct: 0 },
        { axis: "البرمجيات المكتبية وحزمة Office", q: "في Microsoft Word، ميزة 'نسخ التنسيق' (Format Painter) تهدف أساساً إلى:", options: ["تكرار الكلمات والنصوص المظللة", "نسخ نوع الخط وحجمه ولونه وتطبيقه على نص آخر بسرعة", "تحويل المستند إلى ملف PDF", "إدراج صورة منسقة تلقائياً"], correct: 1 },
        { axis: "البرمجيات المكتبية وحزمة Office", q: "أي البرامج التالية يتبع لحزمة مايكروسوفت أوفيس ويتخصص في إدارة وتصميم قواعد البيانات العلائقية؟", options: ["Microsoft Access", "Microsoft Publisher", "Microsoft Outlook", "Microsoft Excel"], correct: 0 },
        { axis: "البرمجيات المكتبية وحزمة Office", q: "لتثبيت سطر العناوين العلوي بشكل دائم في جداول البيانات أثناء التصفح العمودي الطويل نختار ميزة:", options: ["دمج وتوسيط", "تجميد الأجزاء (Freeze Panes)", "فرز وتصفية متقدمة", "تقسيم الخلايا المنطقية"], correct: 1 },

        { axis: "شبكات الحاسوب والإنترنت والبريد الإلكتروني", q: "أي من العناوين البرمجية التالية يمثل البنية الصحيحة والقياسية المعتمدة لعنوان الـ IP الإصدار الرابع (IPv4)؟", options: ["192.168.1.1", "192.168.1.300", "www.google.com", "192-168-1-1"], correct: 0 },
        { axis: "شبكات الحاسوب والإنترنت والبريد الإلكتروني", q: "بروتوكول الإنترنت المعتمد والمسؤول حصرياً عن نقل وتنزيل الملفات من وإلى الخوادم عبر الشبكة هو:", options: ["FTP", "SMTP", "HTTP", "IMAP"], correct: 0 },

        { axis: "شبكات الحاسوب والإنترنت والبريد الإلكتروني", q: "تتميز الشبكات من نوع WAN بأنها شبكات تضمن التغطية الجغرافية على نطاق:", options: ["محدود جداً داخل غرفة واحدة", "متوسط يربط مباني قريبة", "واسع جداً يشمل دولاً وقارات بأكملها", "داخل حافلة النقل المدرسية فقط"], correct: 2 },
        { axis: "شبكات الحاسوب والإنترنت والبريد الإلكتروني", q: "أي الأجهزة الشبكية التالية يعمل بذكاء لتوجيه حزم البيانات بين شبكات مختلفة بالاعتماد على جداول التوجيه? ", options: ["الموجه (Router)", "المبدل (Switch)", "الموزع التقليدي (Hub)", "مكرر الإشارة (Repeater)"], correct: 0 },

        { axis: "الرقمنة والرقمنة في التعليم وعصرنة الإدارة", q: "في سياق عصرنة الإدارة التربوية، ماذا يعكس استخدام التوقيع الإلكتروني (Electronic Signature) على المستندات والوثائق الرسمية؟", options: ["إلغاء الطابع الرسمي والقانوني للوثيقة المحررة", "إضفاء الحجية القانونية والتوثيق الأمني الكامل وتثبيت الهوية الرقمية للموقع مع توفير الوقت والجهد في التنقل", "تزيين شكل المستندات الإدارية", "السماح لأي موظف بتعديل محتوى القرار الوزاري"], correct: 1 },
        { axis: "الرقمنة والرقمنة في التعليم وعصرنة الإدارة", q: "ما هي ميزة تبني المنصات التعليمية غير المتزامنة (Asynchronous Learning) في دورات التكوين والتحضير؟", options: ["إلزام الجميع بالتواجد خلف الشاشات بنفس اللحظة والثانية وبدون خيارات", "إمكانية وصول المترشح للمادة العلمية والدروس والاختبارات والمراجعات في أي وقت يناسب ظروفه وعمله بمرونة", "إلغاء الاختبارات والتقييمات النهائية للمستويات", "الاعتماد الفردي على الاتصالات السلكية القديمة المعقدة"], correct: 1 },
        { axis: "الرقمنة والرقمنة في التعليم وعصرنة الإدارة", q: "تعد عملية 'التدريس الهجين' (Blended Learning) أحد الآثار الإيجابية لرقمنة التعليم، والمقصود به:", options: ["التعليم القائم على المراسلات الورقية البريدية الفردية", "الدمج الذكي والمتوازن بين التعليم الحضوري الكلاسيكي داخل القسم والتعليم الإلكتروني عبر المنصات السحابية", "إلغاء الحصص التطبيقية والاعتماد على النظري الشامل", "التدريس الموجه لقطاعات البناء والأشغال فقط"], correct: 1 },
        { axis: "الرقمنة والرقمنة في التعليم وعصرنة الإدارة", q: "ما هو الهدف الحقيقي من وراء توفير 'الفضاء الرقمي الخاص بالأستاذ' ضمن أرضية تسيير التمدرس؟", options: ["مراقبة تحركاته خارج أوقات العمل", "تمكينه من حجز النقاط، متابعة الأفواج التربوية، واستخراج وثائقه المهنية والتربوية الفردية بكل سهولة وعن بعد", "حرمانه من العطل السنوية القانونية المحددة بالقطاع", "إلغاء الدفتر المدرسي الورقي دون إيجاد بدائل تخزينية آمنة"], correct: 1 },
        { axis: "الرقمنة والرقمنة في التعليم وعصرنة الإدارة", q: "أي من التكنولوجيات التالية يُسخدم لحفظ وتأمين كافة بيانات المنتسبين لقطاع التربية الوطنية ضد التلف المفاجئ أو كوارث الأجهزة المحلية؟", options: ["النسخ الاحتياطي الدوري المشفر على الخوادم المركزية والسحابة الحكومية المؤمنة", "حفظ البيانات في كروت الذاكرة الصغيرة للهواتف", "إبقاء شاشات الحواسب مفعلة طوال أيام السنة دون انقطاع", "طباعة البيانات يومياً ووضعها في الخزائن الحديدية فقط"], correct: 0 },
        { axis: "الرقمنة والرقمنة في التعليم وعصرنة الإدارة", q: "رقمنة قطاع الامتحانات والمسابقات الوطنية (مثل البكالوريا وشهادة التعليم المتوسط ومسابقات الترقية) تساهم مباشرة في دحر ومحاربة:", options: ["المناهج التعليمية المتطورة", "التزوير، المحسوبية، الأخطاء البشرية الحسابية في صب النقاط، وتضمن إعلان النتائج في زمن قياسي قياسي", "مشاركة الأولياء لنتائج أبنائهم", "استخدام العتاد المكتبي الحديث بالمراكز المخصصة للتصحيح"], correct: 1 },
        { axis: "الرقمنة والرقمنة في التعليم وعصرنة الإدارة", q: "تُعرف المنصات التعليمية المفتوحة الموجهة لآلاف المتدربين عبر الويب، والتي تقدم مساقات كاملة واختبارات تفاعلية آلية بمصطلح الكلمة الاختصارية:", options: ["MOOCs", "BIOS", "RAM", "NTFS"], correct: 0 },
        { axis: "الرقمنة والرقمنة في التعليم وعصرنة الإدارة", q: "الغاية العليا والهدف الاستراتيجي من 'عصرنة الإدارة التربوية' والتحول الكامل للبيئة الرقمية في قطاع التربية الوطنية هو:", options: ["الاعتماد الكامل على الآلات الصامتة وإلغاء العنصر البشري", "تجويد الخدمة العمومية التربوية والمدرسية، ترشيد النفقات الورقية، تبسيط الإجراءات، وبناء منظومة تربوية ذكية ومستدامة للتنمية تليق بالأجيال الواعدة", "شراء وتكديس الأجهزة الحديثة في المخازن العامة للمؤسسات الرسمية", "رفع عتبة الامتحانات وصعوبتها للتلاميذ المتمدرسين بكافة الأطوار"], correct: 1 }
    ];

    let currentIdx = 0;
    let correctCount = 0;
    let selections = [];

    function displayStep() {
        const total = bank.length;
        document.getElementById('live-index-text').innerText = currentIdx + 1;
        document.getElementById('live-correct-text').innerText = correctCount;
        
        const pct = Math.round((currentIdx / total) * 100);
        document.getElementById('live-percent-text').innerText = `${pct}%`;
        document.getElementById('progress-indicator').style.width = `${pct}%`;
        document.getElementById('next-step-btn').style.display = 'none';

        const item = bank[currentIdx];
        document.getElementById('current-axis-title').innerText = `المحور: ${item.axis}`;

        const host = document.getElementById('dynamic-question-placeholder');
        let optsMarkup = '';
        item.options.forEach((opt, idx) => {
            optsMarkup += `<div class="option" onclick="processSelection(this, ${idx})">🔹 ${opt}</div>`;
        });

        host.innerHTML = `
            <div style="animation: fadeIn 0.3s ease;">
                <div class="question-text">${currentIdx + 1}) ${item.q}</div>
                <div class="options-grid">${optsMarkup}</div>
            </div>
        `;
    }

    function processSelection(el, idx) {
        const item = bank[currentIdx];
        if(selections.length > currentIdx) return;
        
        const siblings = el.parentElement.getElementsByClassName('option');
        selections.push(idx);

        for(let option of siblings) {
            option.style.pointerEvents = 'none';
        }

        if(idx === item.correct) {
            el.classList.add('correct');
            correctCount++;
            document.getElementById('live-correct-text').innerText = correctCount;
        } else {
            el.classList.add('wrong');
            siblings[item.correct].classList.add('correct');
        }
        document.getElementById('next-step-btn').style.display = 'inline-block';
    }

    function advanceQuiz() {
        currentIdx++;
        if(currentIdx < bank.length) {
            displayStep();
        } else {
            haltAndEvaluate();
        }
    }

    function haltAndEvaluate() {
        document.getElementById('progress-indicator').style.width = `100%`;
        document.getElementById('live-percent-text').innerText = `100%`;
        document.getElementById('quiz-flow-area').style.display = 'none';
        document.getElementById('lower-panel').style.display = 'none';
        document.getElementById('final-results-area').style.display = 'block';
        
        document.getElementById('total-score-render').innerText = `النتيجة النهائية المستحقة: ${correctCount} من ${bank.length}`;
        
        const msg = document.getElementById('final-feedback-msg');
        const ratio = (correctCount / bank.length) * 100;

        if(ratio >= 90) {
            msg.innerHTML = "<b>تهنئة استثنائية من إدارة أكاديمية النسر!</b><br>أنت تجلس الآن على قمة الهرم المعرفي للدورة. مستواك خارق للعادة ومثالي تماماً، ونتوقع بثقة تامة افتكاكك للمرتبة الأولى وبجدارة في مسابقة الترقية جويلية 2026 الرسمية الفعلية.";
        } else if(ratio >= 70) {
            msg.innerHTML = "<b>أداء رائع وممتاز جداً يبعث على الفخر والموثوقية!</b><br>لقد تخطيت بنك الأسئلة الأكبر بنجاح باهر وقوة معرفية واضحة في كافة محاور البرمجيات والرقمنة التربوية وعصرنة الإجراءات المدرسية.";
        } else if(ratio >= 50) {
            msg.innerHTML = "<b>أداء مقبول ونتيجة جيدة تؤهلك للاجتياز!</b><br>لقد حققت النسبة المطلوبة للنجاح، وننصحك بإلقاء نظرة سريعة على كشف الإجابات المصحح بالأسفل لضبط المفاهيم الدقيقة وتجنب الأفخاخ الامتحانية.";
        } else {
            msg.innerHTML = "<b>علامة دون المتوسط، تتطلب إعادة ضبط وتكثيف سريع!</b><br>المسابقة الترقوية الرسمية اقتربت، وننصحك بتحميل النسخة البيضاء فوراً ومراجعة تجميعات الدروس والمراجع والحصص لتعزيز نقاط ضعفك.";
        }
    }

    function exportBlankPdf() {
        const section = document.getElementById('print-section');
        section.innerHTML = `<h1 style="text-align:center; color:#000; font-size:22px;">🦅 بنك المراجعة النهائية والامتحان الشامل والجامع قبل المسابقة</h1>`;
        section.innerHTML += `<p style="text-align:center; font-size:14px; margin-bottom:20px;">دورة التحضير لمسابقة الترقية جويلية 2026 - أكاديمية النسر للتدريب والتعليم التقني (52 سؤالاً معيارياً)</p><hr>`;
        
        bank.forEach((item, idx) => {
            let optionsBlock = '';
            item.options.forEach(opt => {
                optionsBlock += `<div class="print-opt">⬜ ${opt}</div>`;
            });
            section.innerHTML += `
                <div class="print-item">
                    <div style="font-weight:bold; font-size:14px; margin-bottom:8px; color:#000;">[${item.axis}] - السؤال ${idx + 1}: ${item.q}</div>
                    ${optionsBlock}
                </div>
            `;
        });
        window.print();
        section.innerHTML = "";
    }

    function exportGradedPdf() {
        const section = document.getElementById('print-section');
        section.innerHTML = `<h1 style="text-align:center; color:#000; font-size:22px;">📊 كشف ومحضر نقاط المراجعة النهائية التفصيلي للمترشح</h1>`;
        section.innerHTML += `<p style="text-align:center; font-size:16px;">النتيجة الكلية المحصلة: <b>${correctCount} من ${bank.length}</b></p><hr>`;
        
        bank.forEach((item, idx) => {
            let optionsBlock = '';
            const userSelection = selections[idx];
            
            item.options.forEach((opt, oIdx) => {
                let isCorrect = (oIdx === item.correct);
                let isUserWrong = (oIdx === userSelection && userSelection !== item.correct);
                let cls = isCorrect ? 'print-correct' : '';
                let mark = isCorrect ? '✅' : (isUserWrong ? '❌' : '⬜');
                optionsBlock += `<div class="print-opt ${cls}">${mark} ${opt}</div>`;
            });
            section.innerHTML += `
                <div class="print-item">
                    <div style="font-weight:bold; font-size:14px; margin-bottom:8px; color:#000;">السؤال ${idx + 1}: ${item.q}</div>
                    ${optionsBlock}
                </div>
            `;
        });
        window.print();
        section.innerHTML = "";
    }

    window.onload = function() {
        displayStep();
    };
</script>

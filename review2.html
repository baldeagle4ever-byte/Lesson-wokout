<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مراجعة الحصة الثانية - أكاديمية النسر</title>
    <style>
        body {
            background-color: #1a2a33;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .quiz-container {
            max-width: 850px;
            width: 100%;
            background: #243441;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #2c3e50;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .logo { width: 60px; margin-bottom: 10px; }
        .header h2 { color: #ffad33; margin: 5px 0; font-size: 24px; }
        .header p { color: #cfd8dc; font-size: 14px; margin: 5px 0; }
        
        .stats-bar {
            display: flex;
            justify-content: space-between;
            color: #b0bec5;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .progress-bar {
            height: 8px;
            background: #1a2a33;
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #34ace0;
            width: 0%;
            border-radius: 10px;
            transition: width 0.4s ease;
            box-shadow: 0 0 10px #34ace0;
        }
        
        .question-card {
            background: #1d2d3a;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #2c3e50;
            margin-bottom: 20px;
        }
        .category-tag {
            display: inline-block;
            background: #243441;
            color: #ff9f43;
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,159,67,0.3);
        }
        .question-text {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.6;
            color: #ffffff;
            margin-bottom: 20px;
        }
        
        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .option {
            background: #243441;
            padding: 15px 20px;
            margin-bottom: 12px;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid #2c3e50;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }
        .option:hover {
            background: #2c3e50;
            border-color: #34ace0;
        }
        .option-prefix {
            width: 25px;
            height: 25px;
            background: #1a2a33;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 15px;
            font-weight: bold;
            color: #b0bec5;
            font-size: 14px;
        }
        
        /* حالات الإجابة الملونة والمتوهجة */
        .option.correct {
            background: rgba(39, 174, 96, 0.2) !important;
            border-color: #27ae60 !important;
            box-shadow: 0 0 10px rgba(39, 174, 96, 0.4);
        }
        .option.correct .option-prefix { background: #27ae60; color: white; }
        
        .option.wrong {
            background: rgba(192, 41, 43, 0.2) !important;
            border-color: #c0392b !important;
            box-shadow: 0 0 10px rgba(192, 41, 43, 0.4);
        }
        .option.wrong .option-prefix { background: #c0392b; color: white; }

        .btn-container {
            display: flex;
            justify-content: flex-start;
        }
        .btn-next {
            background: #34ace0;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(52, 172, 224, 0.4);
            transition: all 0.2s;
            display: none;
        }
        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 172, 224, 0.6);
        }
        
        .results-screen {
            text-align: center;
            display: none;
            padding: 20px 0;
        }
        .results-screen h2 { color: #ffad33; font-size: 28px; }
        .score-box {
            font-size: 48px;
            font-weight: bold;
            color: #34ace0;
            margin: 20px 0;
            text-shadow: 0 0 15px rgba(52, 172, 224, 0.5);
        }
        .action-btns {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }
        .btn-action {
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            color: white;
            border: none;
            cursor: pointer;
        }
        .btn-retry { background: #ff9f43; box-shadow: 0 4px 15px rgba(255,159,67,0.4); }
        .btn-home { background: #546e7a; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-window">
        <div class="header">
            <img src="logo.png" alt="Logo" class="logo">
            <h2>🎓 مراجعة الحصة الثانية التفاعلية</h2>
            <p>امتحان تفاعلي في مادة الإعلام الآلي — اكتشف أخطاءك فور الإجابة وتعرّف على نقطتك النهائية</p>
        </div>
        
        <div class="stats-bar">
            <div id="category-name">المحور: جاري التحميل...</div>
            <div>السؤال <span id="current-idx">1</span> من 20</div>
        </div>
        
        <div class="progress-bar">
            <div id="progress" class="progress-fill"></div>
        </div>

        <div id="question-area"></div>
        
        <div class="btn-container">
            <button id="next-button" class="btn-next" onclick="nextQuestion()">التالي ←</button>
        </div>
    </div>

    <div id="results-window" class="results-screen">
        <img src="logo.png" alt="Logo" class="logo" style="width: 80px;">
        <h2>أكاديمية النسر للتدريب والتعليم التقني</h2>
        <p>لقد أتممت بنجاح مراجعة الحصة الثانية لـ مسابقة الترقية</p>
        <div class="score-box"><span id="final-score">0</span> / 20</div>
        <p id="feedback-text" style="color: #b0bec5; font-size: 16px;"></p>
        
        <div class="action-btns">
            <button class="btn-action btn-retry" onclick="location.reload()">إعادة الاختبار عشوائياً 🔄</button>
            <a href="index.html" class="btn-action btn-home">العودة للرئيسية</a>
        </div>
    </div>
</div>

<script>
// بنك أسئلة الحصة الثانية الشامل والذكي لضمان التنوع عند التحديث
const bank = [
    { cat: "الذاكرة والتخزين", q: "أي نوع من أنواع الذاكرة يفقد جميع محتوياته بمجرد قطع التيار الكهربائي عن الحاسوب؟", options: ["الذاكرة الميتة (ROM)", "الذاكرة الحية (RAM)", "القرص الصلب (HDD)", "ذاكرة BIOS"], correct: 1 },
    { cat: "الذاكرة والتخزين", q: "أين تخزن إعدادات الإقلاع الأساسية للحاسوب (BIOS)؟", options: ["في ذاكرة الوصول العشوائي RAM", "في الذاكرة الميتة ROM", "في المعالج المركزي CPU", "في القرص الثابت SSD"], correct: 1 },
    { cat: "الذاكرة والتخزين", q: "ما هي الميزة الأساسية لوحدات التخزين من نوع SSD مقارنة بـ HDD؟", options: ["سعرها أرخص بكثير", "تعتمد على أجزاء ميكانيكية متحركة", "سرعة فائقة جداً في القراءة والكتابة ومقاومة الصدمات", "تخزين البيانات بشكل مؤقت فقط"], correct: 2 },
    { cat: "وحدات القياس", q: "كم يساوي 1 كيلو أوكتي (1 Kilo Octet) بالتمام مقارنة بالـ أوكتي؟", options: ["1000 أوكتي", "1024 أوكتي", "512 أوكتي", "2048 أوكتي"], correct: 1 },
    { cat: "وحدات القياس", q: "ما هو المقابل باللغة الإنجليزية للمصطلح الفرنسي 'Giga Octet' (GO)؟", options: ["Gigabit (Gb)", "Gigabyte (GB)", "Mega Octet (MO)", "Terabyte (TB)"], correct: 1 },
    { cat: "وحدات القياس", q: "إذا كان لديك ملف 'فيديو عالي الدقة' (HD Video)، فما هي وحدة القياس الأكثر ملاءمة لحجمه؟", options: ["الـ أوكتي (Octet)", "الكيلو أوكتي (KO)", "الغيغا أوكتي (GO)", "البت (Bit)"], correct: 2 },
    { cat: "وحدات القياس", q: "ما هو الترتيب التصاعدي الصحيح (من الأصغر إلى الأكبر) لوحدات قياس الذاكرة؟", options: ["KO < MO < GO", "GO < MO < KO", "MO < KO < GO", "KO < GO < MO"], correct: 0 },
    { cat: "الشبكات", q: "ما هو المفهوم الدقيق لشبكة الإنترنت (Internet)؟", options: ["شبكة محلية محدودة داخل مبنى واحد", "شبكة عالمية موسعة (WAN) تربط ملايين الحواسيب عبر العالم", "متصفح الويب مثل جوجل كروم", "كابل بحري لنقل الكهرباء"], correct: 1 },
    { cat: "الشبكات", q: "ما هي العناصر الأساسية التي تتكون منها دورة الإرسال والاستقبال في الشبكات؟", options: ["الشاشة والفأرة والمعالج", "المرسل، المستقبل، الرسالة، والوسط الناقل (القناة)", "الكهرباء والإنترنت والبرامج", "نظام التشغيل والتطبيقات"], correct: 1 },
    { cat: "الشبكات", q: "الشبكة التي تربط الأجهزة داخل مساحة جغرافية صغيرة (مثل غرفة، مكتب أو مدرسة) تسمى:", options: ["شبكة عالمية (WAN)", "شبكة محلية (LAN)", "شبكة شخصية (PAN)", "الإنترنت"], correct: 1 },
    { cat: "البرامج", q: "البرامج المسؤولية عن إدارة المكونات المادية (Hardware) للحاسوب وتوفير بيئة عمل للتطبيقات هي:", options: ["تطبيقات المستخدم", "أنظمة التشغيل (OS)", "الدريفرات فقط", "الألعاب والترفيه"], correct: 1 },
    { cat: "البرامج", q: "أي من البرامج التالية يعتبر نظام تشغيل (Operating System)؟", options: ["Microsoft Word", "Linux", "Google Chrome", "Adobe Photoshop"], correct: 1 },
    { cat: "البرامج", q: "ما هي الوظيفة الأساسية لبرامج التعريفات أو ما يُعرف بـ 'الدريفرات' (Drivers)؟", options: ["تصفح مواقع الإنترنت بسرعة وأمان", "تعريف الأجزاء الصلبة الملحقة (كالطابعة أو كارت الشاشة) لنظام التشغيل", "حماية نظام الحاسوب من الاختراق والفيروسات", "تعديل الصور وتحرير الملفات النصية"], correct: 1 },
    { cat: "البرامج", q: "تُصنف البرامج مثل الحاسبة (Calculator) وحزمة الآوفيس (Office) ضمن قسم:", options: ["أنظمة التشغيل", "تطبيقات المستخدم (Applications)", "برامج الإقلاع والبيوس", "الدريفرات الأساسية"], correct: 1 },
    { cat: "الذاكرة والتخزين", q: "تتميز الذاكرة الميتة (ROM) عن الذاكرة الحية (RAM) بأنها:", options: ["تفقد محتواها بمجرد إطفاء الجهاز", "ذاكرة قراءة فقط ولا يمكن للمستخدم العادي تعديلها أو مسحها", "ذات مساحة تخزينية ضخمة جداً تصل إلى التيرا", "تُستخدم لتسريع الألعاب الثقيلة"], correct: 1 },
    { cat: "وحدات القياس", q: "الملفات النصية البسيطة جداً (مثل مستند نصي .txt) يقاس حجمها عادة بـ:", options: ["الكيلو أوكتي (KO)", "الغيغا أوكتي (GO)", "التيرا أوكتي (TO)", "الميغا أوكتي (MO)"], correct: 0 },
    { cat: "الشبكات", q: "في دورة الإرسال، ما هو دور 'المستقبل' (Receiver)؟", options: ["توليد الرسالة وإرسالها عبر الكابل", "استلام الإشارات وتحويلها إلى معلومات مفهومة للمستخدم", "قطع الاتصال عند حدوث خطأ", "تخزين البيانات في القرص الصلب"], correct: 1 },
    { cat: "البرامج", q: "نظام التشغيل الشهير (Android) مخصص في الأصل لإدارة وتشغيل:", options: ["أجهزة الخوادم الضخمة", "الهواتف الذكية والأجهزة اللوحية", "أجهزة الطابعات والماسحات الضوئية", "أجهزة التلفاز القديمة فقط"], correct: 1 },
    { cat: "الذاكرة والتخزين", q: "أي مما يلي يعتبر وحدة تخزين ثانوية (دائمة) تحتفظ بالملفات حتى بعد إغلاق الحاسوب؟", options: ["الذاكرة الحية RAM", "المعالج المركزي CPU", "القرص الصلب الثابت (HDD / SSD)", "ذاكرة الكاش Cache"], correct: 2 },
    { cat: "وحدات القياس", q: "1 ميغا أوكتي (1 Mega Octet) يعادل بالتقريب الكمي الفني:", options: ["1024 كيلو أوكتي (KO)", "100 كيلو أوكتي (KO)", "1000 غيغا أوكتي (GO)", "10 أوكتي"], correct: 0 },
    { cat: "الشبكات", q: "ما نوع الوسط الناقل المستخدم في تقنية الـ Wi-Fi للربط بين الأجهزة؟", options: ["وسط سلكي (ألياف بصرية)", "وسط لاسلكي (أمواج راديوية)", "وسط مغناطيسي", "وسط نحاسي"], correct: 1 },
    { cat: "البرامج", q: "نظام التشغيل Microsoft Windows يُصنف تجارياً وتقنياً بأنه:", options: ["تطبيق برمجى مجاني", "نظام تشغيل مغلق المصدر ومدفوع", "برنامج تعريف للدريفرات", "ملف خبيث وضار بالجهاز"], correct: 1 }
];

let selectedQuestions = [];
let currentIdx = 0;
let score = 0;
const prefixes = ['أ', 'ب', 'ج', 'د'];

function initQuiz() {
    // خلط بنك الأسئلة بالكامل عشوائياً ثم اقتطاع أول 20 سؤالاً فقط
    selectedQuestions = bank.sort(() => 0.5 - Math.random()).slice(0, 20);
    renderQuestion();
}

function renderQuestion() {
    const qBox = document.getElementById('question-area');
    const nextBtn = document.getElementById('next-button');
    const q = selectedQuestions[currentIdx];
    
    // تحديث المؤشرات العلوية وشريط التقدم
    document.getElementById('current-idx').innerText = currentIdx + 1;
    document.getElementById('category-name').innerText = "المحور: " + q.cat;
    document.getElementById('progress').style.width = ((currentIdx) / 20 * 100) + '%';
    
    nextBtn.style.display = 'none';

    let html = `
        <div class="question-card">
            <span class="category-tag">${q.cat}</span>
            <div class="question-text">${currentIdx + 1}. ${q.q}</div>
            <ul class="options-list">
                ${q.options.map((opt, i) => `
                    <li class="option" onclick="evaluateAnswer(this, ${i})">
                        <div class="option-prefix">${prefixes[i]}</div>
                        <div>${opt}</div>
                    </li>
                `).join('')}
            </ul>
        </div>
    `;
    qBox.innerHTML = html;
}

function evaluateAnswer(selectedElement, choiceIndex) {
    const q = selectedQuestions[currentIdx];
    const options = selectedElement.parentElement.getElementsByClassName('option');
    
    // تجميد الخيارات لمنع التلاعب أو الضغط المزدوج
    for (let opt of options) {
        opt.style.pointerEvents = 'none';
    }

    if (choiceIndex === q.correct) {
        selectedElement.classList.add('correct');
        score++;
    } else {
        selectedElement.classList.add('wrong');
        options[q.correct].classList.add('correct'); // كشف الإجابة الصحيحة فوراً
    }
    
    document.getElementById('next-button').style.display = 'inline-block';
}

function nextQuestion() {
    currentIdx++;
    if (currentIdx < 20) {
        renderQuestion();
    } else {
        finishQuiz();
    }
}

function finishQuiz() {
    document.getElementById('quiz-window').style.display = 'none';
    document.getElementById('results-window').style.display = 'block';
    document.getElementById('final-score').innerText = score;
    
    const feedback = document.getElementById('feedback-text');
    if (score >= 16) {
        feedback.innerText = "ممتاز جداً! مستواك رائع ومعلوماتك حول الذاكرة والشبكات والبرامج دقيقة للغاية.";
    } else if (score >= 10) {
        feedback.innerText = "أداء جيد! لقد اجتزت الاختبار بنجاح، ومراجعة الأخطاء ستساعدك على التميز الكامل.";
    } else {
        feedback.innerText = "بحاجة إلى مراجعة. نقترح عليك إعادة قراءة محاور الذاكرة والبرامج والمحاولة مرة أخرى لتثبيت المعلومات.";
    }
}

// بدء التشغيل الفوري
initQuiz();
</script>

</body>
</html>

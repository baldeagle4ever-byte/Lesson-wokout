<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مراجعة الحصة الثانية - أكاديمية النسر</title>
    <style>
        body {
            background-color: #1a2a33;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .quiz-container {
            max-width: 850px;
            width: 100%;
            background: #243441;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #2c3e50;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .header h2 { color: #ffad33; margin: 5px 0; font-size: 24px; }
        .header p { color: #cfd8dc; font-size: 14px; margin: 5px 0 0 0; }
        .progress-bar {
            height: 6px;
            background-color: #1a2a33;
            border-radius: 3px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress {
            height: 100%;
            background-color: #ff9f43;
            width: 0%;
            transition: width 0.3s ease;
        }
        .question-box { display: none; }
        .question-box.active { display: block; }
        .question-text { font-size: 20px; font-weight: bold; margin-bottom: 20px; line-height: 1.6; }
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #2c3e50;
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            border: 2px solid transparent;
            font-size: 16px;
        }
        .option:hover { background: #34495e; transform: scale(1.01); }
        .option.correct { background: #2ed573 !important; border-color: #26af5f; color: white; }
        .option.wrong { background: #ff4757 !important; border-color: #d63031; color: white; }
        .actions { margin-top: 25px; text-align: left; }
        .btn {
            background-color: #ff9f43;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            display: none;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #e67e22; }
        .results-window { display: none; text-align: center; padding: 20px; }
        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid #ffad33;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
        }
        .score-circle .num { font-size: 32px; font-weight: bold; color: #ffad33; }
        .feedback { font-size: 18px; margin-top: 15px; color: #cfd8dc; }
        .home-btn {
            display: inline-block;
            margin-top: 25px;
            background-color: #34ace0;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        .home-btn:hover { background-color: #227093; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h2>⚙️ مراجعة الحصة الثانية: الشبكات، التخزين، والبرمجيات</h2>
        <p id="question-counter">السؤال 1 من 20</p>
    </div>

    <div class="progress-bar">
        <div class="progress" id="progress-line"></div>
    </div>

    <div id="quiz-window">
        <div id="question-container"></div>
        <div class="actions">
            <button class="btn" id="next-button" onclick="nextQuestion()">التالي</button>
        </div>
    </div>

    <div id="results-window" class="results-window">
        <h2>📊 نتيجتك النهائية</h2>
        <div class="score-circle">
            <div class="num" id="final-score">0</div>
            <div style="font-size: 12px; color: #aaa;">من 20</div>
        </div>
        <p class="feedback" id="feedback-text"></p>
        <a href="index.html" class="home-btn">العودة للرئيسية</a>
    </div>
</div>

<script>
    // بنية الـ 100 سؤال الشاملة للمحاور الثلاثة
    const allQuestions = [
        // --- محور الشبكات ---
        {
            q: "ما هو البروتوكول المسؤول عن تصفح المواقع الإلكترونية الآمنة ونقل البيانات عبر الإنترنت؟",
            options: ["FTP", "HTTP", "HTTPS", "SMTP"],
            correct: 2
        },
        {
            q: "أي من الشبكات التالية تُغطي نطاقاً جغرافياً واسعاً جداً مثل الدول أو القارات؟",
            options: ["LAN", "WAN", "MAN", "PAN"],
            correct: 1
        },
        {
            q: "الجهاز المسؤول عن ربط شبكات مختلفة وتوجيه الحزم البرمجية بينها يسمى:",
            options: ["المُوجّه (Router)", "المُوزّع (Hub)", "المبدّل (Switch)", "المودم"],
            correct: 0
        },
        // --- محور التخزين ---
        {
            q: "أي من وحدات التخزين التالية تعتبر الأسرع في قراءة وكتابة البيانات وتعمل دون أجزاء ميكانيكية متحركة؟",
            options: ["HDD", "SSD", "القرص المرن", "الأقراص الضوئية"],
            correct: 1
        },
        {
            q: "وحدة القياس التي تعادل 1024 ميجابايت (MB) هي:",
            options: ["الكيلوبايت", "الجيجابايت (GB)", "الترابايت", "البيتابايت"],
            correct: 1
        },
        // --- محور البرمجيات ---
        {
            q: "البرنامج الأساسي الذي يقوم بإدارة موارد الحاسوب والملفات ويعتبر وسيطاً بين المستخدم والعتاد هو:",
            options: ["برامج التطبيقات", "برمجيات النظام (نظام التشغيل)", "مفسر الأوامر", "قواعد البيانات"],
            correct: 1
        },
        {
            q: "أي مما يلي يعتبر تطبيقاً برمجياً مفتوح المصدر (Open Source)؟",
            options: ["Windows 11", "Microsoft Office", "نظام تشغيل Linux", "macOS"],
            correct: 2
        },
        
        // ... يمكنك الاستمرار في نسخ ولصق الأسطر وتعبئتها حتى تصل إلى 100 سؤال كاملة بنفس النسق البرمجي ...
        {
            q: "سؤال رقم 100 حول الشبكات أو التخزين أو البرمجيات؟",
            options: ["خيار 1", "خيار 2", "خيار 3 الصحيح", "خيار 4"],
            correct: 2
        }
    ];

    let activeQuestions = [];
    let currentIdx = 0;
    let score = 0;

    // دالة برمجية ممتازة لخلط الأسئلة عشوائياً واختيار 20 فقط في كل مرة
    function setupQuiz() {
        // خلط الأسئلة الأصلية عشوائياً بالكامل
        const shuffled = [...allQuestions].sort(() => 0.5 - Math.random());
        // اقتطاع 20 سؤالاً فقط منها
        activeQuestions = shuffled.slice(0, 20);
        renderQuestion();
    }

    function renderQuestion() {
        const totalQ = activeQuestions.length;
        document.getElementById('question-counter').innerText = `السؤال ${currentIdx + 1} من ${totalQ}`;
        document.getElementById('next-button').style.display = 'none';
        
        const progressPercent = (currentIdx / totalQ) * 100;
        document.getElementById('progress-line').style.width = `${progressPercent}%`;

        const q = activeQuestions[currentIdx];
        const container = document.getElementById('question-container');
        
        let optionsHtml = '';
        q.options.forEach((opt, idx) => {
            optionsHtml += `<div class="option" onclick="checkAnswer(this, ${idx})">${opt}</div>`;
        });

        container.innerHTML = `
            <div class="question-box active">
                <div class="question-text">${q.q}</div>
                <div class="options-list">${optionsHtml}</div>
            </div>
        `;
    }

    function checkAnswer(selectedElement, choiceIndex) {
        const q = activeQuestions[currentIdx];
        const options = selectedElement.parentElement.getElementsByClassName('option');
        
        for (let opt of options) {
            opt.style.pointerEvents = 'none';
        }

        if (choiceIndex === q.correct) {
            selectedElement.classList.add('correct');
            score++;
        } else {
            selectedElement.classList.add('wrong');
            options[q.correct].classList.add('correct');
        }
        
        document.getElementById('next-button').style.display = 'inline-block';
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < activeQuestions.length) {
            renderQuestion();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        document.getElementById('progress-line').style.width = `100%`;
        document.getElementById('quiz-window').style.display = 'none';
        document.getElementById('results-window').style.display = 'block';
        document.getElementById('final-score').innerText = score;
        
        const feedback = document.getElementById('feedback-text');
        const percent = (score / activeQuestions.length) * 100;

        if (percent >= 80) {
            feedback.innerText = "رائع جداً! مستواك أسطوري في الشبكات والتخزين والبرمجيات. 🦅";
        } else if (percent >= 50) {
            feedback.innerText = "عمل جيد! لقد نجحت في المراجعة بنجاح، وستساعدك إعادة التدريب على ضبط الأخطاء.";
        } else {
            feedback.innerText = "تحتاج لمراجعة مفاهيم الشبكات والبرمجيات مرة أخرى بتركيز أعلى. لا تستسلم واعد المحاولة!";
        }
    }

    // تهيئة الاختبار العشوائي عند تحميل الصفحة
    window.onload = setupQuiz;
</script>

</body>
    </html>

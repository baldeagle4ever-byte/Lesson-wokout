<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مراجعة الحصة الثانية - أكاديمية النسر</title>
    <style>
        body { background-color: #1a2a33; color: white; font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; }
        .quiz-container { max-width: 800px; margin: auto; background: #243441; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .header { text-align: center; border-bottom: 2px solid #34495e; padding-bottom: 20px; margin-bottom: 20px; }
        .header h2 { color: #ffad33; }
        .question-box { margin-bottom: 25px; display: none; }
        .question-text { font-size: 20px; margin-bottom: 15px; color: #ecf0f1; }
        .options { list-style: none; padding: 0; }
        .option { background: #34495e; padding: 12px; margin: 8px 0; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .option:hover { background: #4b6584; }
        .option.correct { background: #27ae60 !important; }
        .option.wrong { background: #c0392b !important; }
        .progress-bar { height: 10px; background: #34495e; border-radius: 5px; margin-bottom: 20px; }
        .progress-fill { height: 100%; background: #34ace0; width: 0%; border-radius: 5px; transition: 0.5s; }
        .results { text-align: center; display: none; }
        .btn-next { background: #34ace0; color: white; border: none; padding: 10px 25px; border-radius: 5px; cursor: pointer; float: left; margin-top: 10px; }
        .category-tag { display: inline-block; background: #1a2a33; font-size: 12px; padding: 3px 10px; border-radius: 10px; margin-bottom: 10px; color: #34ace0; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h2>🎓 مراجعة الحصة الثانية: الذاكرة، الشبكات والبرامج</h2>
        <div id="stats">سؤال <span id="current-q-num">1</span> من 20</div>
    </div>
    
    <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>

    <div id="quiz-body">
        </div>

    <div id="results-area" class="results">
        <h2>انتهى الاختبار!</h2>
        <p style="font-size: 24px;">نتيجتك هي: <span id="score">0</span> من 20</p>
        <button onclick="location.reload()" class="btn-next" style="float: none;">إعادة المحاولة 🔄</button>
        <a href="index.html" style="color: white; display: block; margin-top: 20px;">العودة للرئيسية</a>
    </div>
    
    <button id="next-btn" class="btn-next" style="display:none;" onclick="showNextQuestion()">التالي ←</button>
    <div style="clear:both;"></div>
</div>

<script>
// بنك الأسئلة (سيتم اختيار 20 منها عشوائياً)
const questionsBank = [
    { cat: "الذاكرة", q: "ما هي الذاكرة التي تفقد محتواها عند انقطاع التيار الكهربائي؟", options: ["RAM", "ROM", "SSD", "HDD"], correct: 0 },
    { cat: "الذاكرة", q: "أي نوع من الذاكرة يحتوي على إعدادات الـ BIOS الأساسية؟", options: ["RAM", "ROM", "القرص الصلب", "المعالج"], correct: 1 },
    { cat: "التخزين", q: "أيهما أسرع في الوصول للبيانات؟", options: ["SSD", "HDD", "القرص المرن", "CD"], correct: 0 },
    { cat: "وحدات القياس", q: "1 كيلو أوكتي (1 KO) يساوي كم أوكتي؟", options: ["1000", "1024", "512", "2048"], correct: 1 },
    { cat: "وحدات القياس", q: "كم يقابل 'Giga Octet' باللغة الإنجليزية؟", options: ["GB", "MB", "KB", "TB"], correct: 0 },
    { cat: "وحدات القياس", q: "أي وحدة قياس تناسب حجم ملف 'فيديو عالي الدقة'؟", options: ["KO", "Octet", "GO", "MO"], correct: 2 },
    { cat: "وحدات القياس", q: "الترتيب الصحيح من الأصغر للأكبر هو:", options: ["KO < MO < GO", "GO < MO < KO", "MO < KO < GO", "KO < GO < MO"], correct: 0 },
    { cat: "الشبكات", q: "ما هو تعريف الأنترنت؟", options: ["شبكة محلية LAN", "شبكة عالمية WAN", "برنامج تصفح", "جهاز استقبال"], correct: 1 },
    { cat: "الشبكات", q: "دورة الإرسال تتكون من مرسل، مستلم، ورسالة و....؟", options: ["كهرباء", "وسط ناقل (قناة)", "شاشة", "لوحة مفاتيح"], correct: 1 },
    { cat: "الشبكات", q: "الشبكة المحلية التي تربط أجهزة في غرفة واحدة تسمى:", options: ["WAN", "PAN", "LAN", "Internet"], correct: 2 },
    { cat: "البرامج", q: "ما هو البرنامج الذي يعتبر 'قلب' الحاسوب ويدير الأجزاء الصلبة؟", options: ["تطبيقات المستخدم", "نظام التشغيل (OS)", "الدريفرات", "الألعاب"], correct: 1 },
    { cat: "البرامج", q: "أيهما يعتبر نظام تشغيل؟", options: ["Microsoft Word", "Google Chrome", "Linux", "Photoshop"], correct: 2 },
    { cat: "البرامج", q: "ما هي وظيفة 'الدريفرات' (Drivers)؟", options: ["كتابة النصوص", "تعريف الأجزاء الصلبة لنظام التشغيل", "حماية الجهاز من الفيروسات", "تصفح الانترنت"], correct: 1 },
    { cat: "البرامج", q: "برنامج الحاسبة (Calculator) يصنف ضمن:", options: ["أنظمة التشغيل", "تطبيقات المستخدم", "الدريفرات", "البيوس"], correct: 1 },
    { cat: "الذاكرة", q: "سعة الذاكرة RAM تقاس عادة بـ:", options: ["الهرتز", "الوات", "الغيغا أوكتي (GO)", "المتر"], correct: 2 },
    { cat: "التخزين", q: "الذاكرة SSD تتميز عن HDD بـ:", options: ["سعرها أرخص", "تحتوي أجزاء ميكانيكية متحركة", "مقاومة للصدمات وأسرع", "أبطأ في التشغيل"], correct: 2 },
    { cat: "وحدات القياس", q: "ملف نصي بسيط (Text) غالباً ما يقاس بـ:", options: ["KO", "GO", "TO", "MO"], correct: 0 },
    { cat: "الشبكات", q: "في عملية الاستقبال، الجهاز الذي يحول الإشارات إلى معلومات هو:", options: ["المرسل", "المستقبل", "الكابل", "المودم"], correct: 1 },
    { cat: "البرامج", q: "الأندرويد (Android) هو نظام تشغيل خاص بـ:", options: ["أجهزة الكمبيوتر فقط", "الهواتف الذكية", "الطابعات", "أجهزة التلفاز القديمة"], correct: 1 },
    { cat: "الذاكرة", q: "ماذا تعني اختصار ROM؟", options: ["ذاكرة الوصول العشوائي", "ذاكرة القراءة فقط", "قرص التخزين السريع", "وحدة المعالجة"], correct: 1 },
    { cat: "التخزين", q: "أي من هذه المكونات يعتبر تخزيناً ثانوياً (دائماً)؟", options: ["RAM", "المعالج", "HDD", "المروحة"], correct: 2 },
    { cat: "وحدات القياس", q: "1 Mega Octet يساوي تقريباً كم كيلو أوكتي؟", options: ["1024 KO", "100 KO", "10 KO", "1 KO"], correct: 0 },
    { cat: "البرامج", q: "نظام الويندوز يعتبر برنامجاً:", options: ["تطبيقياً", "نظام تشغيل", "تعريفياً", "فيروسياً"], correct: 1 },
    { cat: "الشبكات", q: "الـ Wi-Fi هو وسط ناقل:", options: ["سلكي", "لاسلكي", "مغناطيسي", "ورقي"], correct: 1 },
    { cat: "الذاكرة", q: "الـ BIOS يبدأ عمله عند:", options: ["إيقاف الجهاز", "تشغيل الجهاز (Boot)", "فتح ملف Word", "تثبيت لعبة"], correct: 1 }
];

let selectedQuestions = [];
let currentQuestionIndex = 0;
let score = 0;

function initQuiz() {
    // خلط الأسئلة واختيار 20
    selectedQuestions = questionsBank.sort(() => 0.5 - Math.random()).slice(0, 20);
    showQuestion();
}

function showQuestion() {
    const quizBody = document.getElementById('quiz-body');
    const q = selectedQuestions[currentQuestionIndex];
    
    document.getElementById('current-q-num').innerText = currentQuestionIndex + 1;
    document.getElementById('progress').style.width = ((currentQuestionIndex) / 20 * 100) + '%';
    
    let html = `
        <div class="question-box" style="display:block;">
            <span class="category-tag">${q.cat}</span>
            <div class="question-text">${currentQuestionIndex + 1}. ${q.q}</div>
            <ul class="options">
                ${q.options.map((opt, i) => `
                    <li class="option" onclick="checkAnswer(this, ${i})">${opt}</li>
                `).join('')}
            </ul>
        </div>
    `;
    quizBody.innerHTML = html;
    document.getElementById('next-btn').style.display = 'none';
}

function checkAnswer(el, index) {
    const q = selectedQuestions[currentQuestionIndex];
    const options = el.parentElement.getElementsByClassName('option');
    
    // منع الضغط المتكرر
    for(let opt of options) opt.style.pointerEvents = 'none';

    if(index === q.correct) {
        el.classList.add('correct');
        score++;
    } else {
        el.classList.add('wrong');
        options[q.correct].classList.add('correct'); // إظهار الإجابة الصحيحة
    }
    
    document.getElementById('next-btn').style.display = 'block';
}

function showNextQuestion() {
    currentQuestionIndex++;
    if(currentQuestionIndex < 20) {
        showQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    document.getElementById('quiz-body').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
    document.getElementById('stats').style.display = 'none';
    document.getElementById('progress').style.width = '100%';
    
    const resultsArea = document.getElementById('results-area');
    resultsArea.style.display = 'block';
    document.getElementById('score').innerText = score;
}

initQuiz();
</script>

</body>
</html>

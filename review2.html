<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مراجعة الحصة الثانية - أكاديمية النسر</title>
    <style>
        body {
            background-color: #1a2a33;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .quiz-container {
            max-width: 850px;
            width: 100%;
            background: #243441;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #2c3e50;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .header h2 { color: #ffad33; margin: 5px 0; font-size: 24px; }
        .header p { color: #cfd8dc; font-size: 14px; margin: 5px 0 0 0; }
        .progress-bar {
            height: 6px;
            background-color: #1a2a33;
            border-radius: 3px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress {
            height: 100%;
            background-color: #ff9f43;
            width: 0%;
            transition: width 0.3s ease;
        }
        .question-box { display: none; }
        .question-box.active { display: block; }
        .question-text { font-size: 20px; font-weight: bold; margin-bottom: 20px; line-height: 1.6; }
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #2c3e50;
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            border: 2px solid transparent;
            font-size: 16px;
        }
        .option:hover { background: #34495e; transform: scale(1.01); }
        .option.correct { background: #2ed573 !important; border-color: #26af5f; color: white; }
        .option.wrong { background: #ff4757 !important; border-color: #d63031; color: white; }
        .actions { margin-top: 25px; text-align: left; }
        .btn {
            background-color: #ff9f43;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            display: none;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #e67e22; }
        .results-window { display: none; text-align: center; padding: 20px; }
        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid #ffad33;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
        }
        .score-circle .num { font-size: 32px; font-weight: bold; color: #ffad33; }
        .feedback { font-size: 18px; margin-top: 15px; color: #cfd8dc; }
        .home-btn {
            display: inline-block;
            margin-top: 25px;
            background-color: #34ace0;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        .home-btn:hover { background-color: #227093; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h2>⚙️ مراجعة الحصة الثانية: الشبكات، التخزين، والبرمجيات</h2>
        <p id="question-counter">السؤال 1 من 20</p>
    </div>

    <div class="progress-bar">
        <div class="progress" id="progress-line"></div>
    </div>

    <div id="quiz-window">
        <div id="question-container"></div>
        <div class="actions">
            <button class="btn" id="next-button" onclick="nextQuestion()">التالي</button>
        </div>
    </div>

    <div id="results-window" class="results-window">
        <h2>📊 نتيجتك النهائية</h2>
        <div class="score-circle">
            <div class="num" id="final-score">0</div>
            <div style="font-size: 12px; color: #aaa;">من 20</div>
        </div>
        <p class="feedback" id="feedback-text"></p>
        <a href="index.html" class="home-btn">العودة للرئيسية</a>
    </div>
</div>

<script>
    // مصفوفة تحتوي على 20 سؤالاً كاملاً بدون فراغات وموزعة على المحاور المطلوبة
    const questions = [
        // --- محور الشبكات ---
        {
            q: "ما هو البروتوكول المسؤول عن تصفح المواقع الإلكترونية الآمنة والمشفرة عبر الإنترنت؟",
            options: ["FTP", "HTTP", "HTTPS", "SMTP"],
            correct: 2
        },
        {
            q: "أي من أنواع الشبكات التالية تُغطي نطاقاً جغرافياً واسعاً جداً يربط بين الدول والقارات؟",
            options: ["LAN", "WAN", "MAN", "PAN"],
            correct: 1
        },
        {
            q: "الجهاز الذكي المسؤول عن ربط شبكات مختلفة وتوجيه حزم البيانات بينها يسمى:",
            options: ["المُوجّه (Router)", "المُوزّع (Hub)", "المبدّل (Switch)", "المودم"],
            correct: 0
        },
        {
            q: "الشبكة التي تربط الأجهزة داخل مكتب واحد أو مبنى سكني صغير تسمى شبكة:",
            options: ["شبكة عالمية WAN", "شبكة محلية LAN", "شبكة إقليمية MAN", "شبكة شخصية PAN"],
            correct: 1
        },
        {
            q: "ما هي التقنية اللاسلكية المستخدمة لربط الأجهزة القريبة جداً ضمن شبكة شخصية (PAN)؟",
            options: ["الواي فاي Wi-Fi", "البلوتوث Bluetooth", "الألياف البصرية", "الإنترنت الفضائي"],
            correct: 1
        },
        {
            q: "أي من المكونات التالية يعتبر مسؤولاً عن منح الحاسوب عنوان IP الفريد الخاص به داخل الشبكة؟",
            options: ["بطاقة الشبكة NIC", "المعالج CPU", "القرص الصلب", "الذاكرة العشوائية RAM"],
            correct: 0
        },
        {
            q: "النموذج الذي تعتمد فيه الشبكة على جهاز مركزي قوي يقدم الخدمات لبقية الأجهزة يسمى نظام:",
            options: ["الند للند Peer-to-Peer", "الخادم والعميل Client-Server", "الشبكة الحلقية", "الشبكة الخطية"],
            correct: 1
        },
        // --- محور التخزين ---
        {
            q: "أي من وحدات التخزين التالية تعتبر الأسرع في الأداء وتعمل بدون أجزاء ميكانيكية متحركة؟",
            options: ["القرص الصلب HDD", "القرص الصلب SSD", "القرص المرن Floppy", "الأقراص الضوئية DVD"],
            correct: 1
        },
        {
            q: "وحدة القياس التي تعادل بدقة 1024 ميجابايت (MB) هي:",
            options: ["الكيلوبايت KB", "الجيجابايت GB", "الترابايت TB", "البايت Byte"],
            correct: 1
        },
        {
            q: "ما هي ميزة التخزين السحابي (Cloud Storage) الأساسية مقارنة بالوسائط التقليدية؟",
            options: ["عدم الحاجة لإنترنت نهائياً", "إمكانية الوصول للملفات من أي مكان وجهاز", "تعتمد على أقراص مرنة", "أنها تعمل داخل المعالج فقط"],
            correct: 2
        },
        {
            q: "ترتيب وحدات قياس التخزين من الأصغر إلى الأكبر هو:",
            options: ["KB < MB < GB < TB", "TB < GB < MB < KB", "MB < KB < TB < GB", "GB < TB < KB < MB"],
            correct: 0
        },
        {
            q: "أي من وسائط التخزين التالية يعتبر وسيطاً تخزينياً ضوئياً؟",
            options: ["القرص الصلب الداخلي", "ذاكرة الفلاش Flash Drive", "أقراص البلوراي والـ DVD", "ذاكرة الكاش Cache"],
            correct: 2
        },
        {
            q: "ما هي الذاكرة التي تفقد كل محتوياتها فور انقطاع التيار الكهربائي عن الحاسوب؟",
            options: ["ذاكرة القراءة فقط ROM", "القرص الصلب SSD", "الذاكرة العشوائية RAM", "ذاكرة الفلاش"],
            correct: 2
        },
        // --- محور البرمجيات ---
        {
            q: "البرنامج الأساسي المسؤول عن إدارة موارد العتاد والملفات ويعتبر وسيطاً بين المستخدم والجهاز هو:",
            options: ["برامج التطبيقات", "نظام التشغيل (Operating System)", "لغات البرمجة", "برامج الحماية"],
            correct: 1
        },
        {
            q: "أي مما يلي يعتبر مثالاً على نظام تشغيل مفتوح المصدر (Open Source)؟",
            options: ["Windows 11", "Microsoft Office", "نظام Linux", "macOS"],
            correct: 2
        },
        {
            q: "البرامج التي تدمج مع نظام التشغيل للقيام بمهام صيانة وحماية معينة مثل ضغط الملفات ومكافحة الفيروسات تسمى:",
            options: ["البرمجيات الخدمية (Utilities)", "أنظمة تشغيل متطورة", "التطبيقات المكتبية", "برامج الميديا"],
            correct: 0
        },
        {
            q: "يصنف برنامج الجداول الحسابية Microsoft Excel وباقي حزمة الأوفيس ضمن:",
            options: ["برمجيات النظام", "البرمجيات التطبيقية (Applications)", "لغات البرمجة المباشرة", "التعريفات الأساسية"],
            correct: 1
        },
        {
            q: "الملفات البرمجية المسؤولة عن جعل نظام التشغيل يتعرف على القطع الجديدة الموصلة بالحاسوب تسمى:",
            options: ["برامج التصفح", "تعريفات الأجهزة (Drivers)", "برامج معالجة النصوص", "قواعد البيانات"],
            correct: 1
        },
        {
            q: "وظيفة جدار الحماية (Firewall) الأساسية في نظام التشغيل هي:",
            options: ["زيادة مساحة التخزين بالقرص الصلب", "مراقبة وحظر حزم البيانات غير المصرح بها عبر الشبكة", "تنظيف الشاشة من الغبار والأوساخ برمجياً", "تغيير نوع الخط تلقائياً"],
            correct: 1
        },
        {
            q: "أي من الأنظمة التالية يعتبر نظام التشغيل الأساسي والأكثر شيوعاً للهواتف الذكية عالمياً؟",
            options: ["Windows", "Android", "Linux Mint", "DOS"],
            correct: 1
        }
    ];

    let currentIdx = 0;
    let score = 0;

    function renderQuestion() {
        const totalQ = questions.length;
        document.getElementById('question-counter').innerText = `السؤال ${currentIdx + 1} من ${totalQ}`;
        document.getElementById('next-button').style.display = 'none';
        
        const progressPercent = (currentIdx / totalQ) * 100;
        document.getElementById('progress-line').style.width = `${progressPercent}%`;

        const q = questions[currentIdx];
        const container = document.getElementById('question-container');
        
        let optionsHtml = '';
        q.options.forEach((opt, idx) => {
            optionsHtml += `<div class="option" onclick="checkAnswer(this, ${idx})">${opt}</div>`;
        });

        container.innerHTML = `
            <div class="question-box active">
                <div class="question-text">${q.q}</div>
                <div class="options-list">${optionsHtml}</div>
            </div>
        `;
    }

    function checkAnswer(selectedElement, choiceIndex) {
        const q = questions[currentIdx];
        const options = selectedElement.parentElement.getElementsByClassName('option');
        
        for (let opt of options) {
            opt.style.pointerEvents = 'none';
        }

        if (choiceIndex === q.correct) {
            selectedElement.classList.add('correct');
            score++;
        } else {
            selectedElement.classList.add('wrong');
            options[q.correct].classList.add('correct');
        }
        
        document.getElementById('next-button').style.display = 'inline-block';
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
            renderQuestion();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        document.getElementById('progress-line').style.width = `100%`;
        document.getElementById('quiz-window').style.display = 'none';
        document.getElementById('results-window').style.display = 'block';
        document.getElementById('final-score').innerText = score;
        
        const feedback = document.getElementById('feedback-text');
        const percent = (score / questions.length) * 100;

        if (percent >= 80) {
            feedback.innerText = "رائع جداً! مستواك أسطوري وممتاز في مراجعة الشبكات والتخزين والبرمجيات. 🦅";
        } else if (percent >= 50) {
            feedback.innerText = "عمل جيد! لقد نجحت في المراجعة بنجاح، وستساعدك إعادة التدريب على ضبط الأخطاء والتميز.";
        } else {
            feedback.innerText = "تحتاج لمراجعة مفاهيم الشبكات والبرمجيات مرة أخرى بتركيز أعلى. لا تستسلم واعد المحاولة! 📚";
        }
    }

    window.onload = renderQuestion;
</script>

</body>
    </html>

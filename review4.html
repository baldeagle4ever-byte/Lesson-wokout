<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مراجعة الحصة الرابعة (Excel) - أكاديمية النسر</title>
    <style>
        body {
            background-color: #1a2a33;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .quiz-container {
            max-width: 850px;
            width: 100%;
            background: #243441;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #2c3e50;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .header h2 { color: #ffad33; margin: 5px 0; font-size: 24px; }
        .header p { color: #cfd8dc; font-size: 14px; margin: 5px 0 0 0; }
        .progress-bar {
            height: 6px;
            background-color: #1a2a33;
            border-radius: 3px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress {
            height: 100%;
            background-color: #ff9f43;
            width: 0%;
            transition: width 0.3s ease;
        }
        .question-box { display: none; }
        .question-box.active { display: block; }
        .question-text { font-size: 20px; font-weight: bold; margin-bottom: 20px; line-height: 1.6; }
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #2c3e50;
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            border: 2px solid transparent;
            font-size: 16px;
        }
        .option:hover { background: #34495e; transform: scale(1.01); }
        .option.correct { background: #2ed573 !important; border-color: #26af5f; color: white; }
        .option.wrong { background: #ff4757 !important; border-color: #d63031; color: white; }
        .actions { margin-top: 25px; text-align: left; }
        .btn {
            background-color: #ff9f43;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            display: none;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #e67e22; }
        .results-window { display: none; text-align: center; padding: 20px; }
        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid #ffad33;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
        }
        .score-circle .num { font-size: 32px; font-weight: bold; color: #ffad33; }
        .feedback { font-size: 18px; margin-top: 15px; color: #cfd8dc; }
        .home-btn {
            display: inline-block;
            margin-top: 25px;
            background-color: #34ace0;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        .home-btn:hover { background-color: #227093; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h2>📊 مراجعة الحصة الرابعة: تبويبات وتنسيقات Excel</h2>
        <p id="question-counter">السؤال 1 من 20</p>
    </div>

    <div class="progress-bar">
        <div class="progress" id="progress-line"></div>
    </div>

    <div id="quiz-window">
        <div id="question-container"></div>
        <div class="actions">
            <button class="btn" id="next-button" onclick="nextQuestion()">التالي</button>
        </div>
    </div>

    <div id="results-window" class="results-window">
        <h2>📊 نتيجتك النهائية</h2>
        <div class="score-circle">
            <div class="num" id="final-score">0</div>
            <div style="font-size: 12px; color: #aaa;">من 20</div>
        </div>
        <p class="feedback" id="feedback-text"></p>
        <a href="index.html" class="home-btn">العودة للرئيسية</a>
    </div>
</div>

<script>
    const questions = [
        {
            q: "أي من التبويبات التالية في Excel يحتوي على أدوات تنسيق الخط والدمج والتوسيط وتنسيق أرقام الخلايا؟",
            options: ["إدراج", "الصفحة الرئيسية (Home)", "صيغ", "عرض"],
            correct: 1
        },
        {
            q: "لدمج عدة خلايا متجاورة وجعلها خلية واحدة مدمجة مع وضع النص في الوسط مباشرة، نستخدم أداة:",
            options: ["التفاف النص", "الدمج والتوسيط (Merge & Center)", "تنسيق شرطي", "فرز وتصفية"],
            correct: 1
        },
        {
            q: "الأداة المسؤولية عن تغيير نوع البيانات داخل الخلية إلى (نسبة مئوية، عملة، تاريخ قصير، نص) تسمى:",
            options: ["تغيير تنسيق الرقم", "محاذاة النص", "الجمع التلقائي", "الأنماط"],
            correct: 0
        },
        {
            q: "من أهم الأدوات الموجودة في مجموعة 'خط' بالصفحة الرئيسية والتي تتحكم في مظهر الجدول:",
            options: ["إدراج دالة حسابية", "تغيير حجم ولون الخط وتحديد حدود الخلايا", "إدراج رسوم بيانية", "تغيير اتجاه الصفحة"],
            correct: 1
        },
        {
            q: "لتحكم في تموضع النص داخل الخلية عمودياً وأفقياً (أعلى، أسفل، وسط، يمين، يسار)، نستخدم أدوات مجموعة:",
            options: ["رقم", "أنماط", "محاذاة (Alignment)", "خلايا"],
            correct: 2
        },
        {
            q: "الفرق الجوهري بين Microsoft Word و Microsoft Excel و PowerPoint هو أن Excel مخصص بشكل أساسي لـ:",
            options: ["إنشاء عروض تقديمية متحركة وملونة", "كتابة المقالات والرسائل الإدارية الطويلة", "العمليات الحسابية وتحليل البيانات الإحصائية وجداول البيانات", "تعديل وقص الصور وتصميم الشعارات"],
            correct: 2
        },
        {
            q: "إذا أردت إدراج صور، أشكال هندسية، لقطات شاشة، أو جداول محورية، يجب التوجه لتبويب:",
            options: ["الصفحة الرئيسية", "صيغ", "إدراج (Insert)", "عرض"],
            correct: 2
        },
        {
            q: "أي تبويب نستخدمه عندما نريد إخفاء أو إظهار خطوط الشبكة الوهمية (Gridlines) وعناوين الصفوف والأعمدة؟",
            options: ["عرض (View)", "صيغ", "إدراج", "الصفحة الرئيسية"],
            correct: 0
        },
        {
            q: "ما التبويب المخصص لإدراج الصيغ الرياضية المعقدة والوصول إلى مكتبة الدوال بالبرنامج؟",
            options: ["عرض", "بيانات", "صيغ (Formulas)", "إدراج"],
            correct: 2
        },
        {
            q: "الوصول النافذة المتقدمة الخاصة بتعديل التعبئة والحدود الدقيقة ونوع البيانات للخلايا يتم عبر خيار:",
            options: ["إخفاء الخلايا", "تنسيق الخلايا (Format Cells)", "حذف ورقة العمل", "الفرز التلقائي"],
            correct: 1
        },
        {
            q: "أي من البرامج التالية يسمى بـ 'برنامج الجداول الحسابية'؟",
            options: ["Microsoft Word", "Microsoft PowerPoint", "Microsoft Excel", "Microsoft Access"],
            correct: 2
        },
        {
            q: "ما الأداة التي تستخدم لجعل النص يظهر في أسطر متعددة داخل نفس الخلية إذا كان أطول من حجمها؟",
            options: ["دمج وتوسيط", "التفاف النص (Wrap Text)", "تنسيق الخلايا", "الشرط التلقائي"],
            correct: 1
        },
        {
            q: "الرمز التلقائي الذي يمثل دالة الجمع السريع (Autosum) في تبويب الصفحة الرئيسية هو الرمز:",
            options: ["fx", "Σ", "%", "$"],
            correct: 1
        },
        {
            q: "تسمى الواجهة الأساسية التي نعمل عليها في برنامج Excel بـ:",
            options: ["مستند (Document)", "ورقة عمل / كتاب عمل (Workbook/Sheet)", "شريحة (Slide)", "منشور (Publication)"],
            correct: 1
        },
        {
            q: "أي من الخيارات التالية يمثل تبويباً رئيسياً ثابتاً في شريط أدوات Excel؟",
            options: ["تبويب الصور", "تبويب صيغ (Formulas)", "تبويب التأثيرات الحركية", "تبويب الجداول الصامتة"],
            correct: 1
        },
        {
            q: "لتلوين خلفية خلية معينة بلون مخصص، نستخدم أداة:",
            options: ["لون الخط", "لون التعبئة (Fill Color)", "حدود الخلايا", "النمط الشرطي"],
            correct: 1
        },
        {
            q: "لتغيير طريقة عرض ورقة العمل من الوضع العادي إلى وضع 'معاينة فواصل الصفحات'، نتوجه إلى تبويب:",
            options: ["عرض (View)", "الصفحة الرئيسية", "إدراج", "صيغ"],
            correct: 0
        },
        {
            q: "تحتوي مجموعة 'خلايا' في الصفحة الرئيسية على أدوات تمكننا من:",
            options: ["إدراج أو حذف صفوف وأعمدة وتعديل حجمها", "كتابة دالة منطقية", "تغيير لغة البرنامج", "حفظ الملف"],
            correct: 0
        },
        {
            q: "الخطوط الرفيعة التي تفصل بين الخلايا في Excel وتظهر أثناء العمل ولكنها لا تظهر تلقائياً عند الطباعة تسمى:",
            options: ["الحدود السميكة", "خطوط الشبكة (Gridlines)", "المحاور الإحصائية", "الفواصل الميتة"],
            correct: 1
        },
        {
            q: "عند نسخ تنسيق خلية معينة وتطبيقه على خلية أخرى دون نسخ المحتوى النصي، نستخدم أداة:",
            options: ["نسخ (Copy)", "نسخ التنسيق (Format Painter)", "لصق خاص", "قص (Cut)"],
            correct: 1
        }
    ];

    let currentIdx = 0;
    let score = 0;

    function renderQuestion() {
        const totalQ = questions.length;
        document.getElementById('question-counter').innerText = `السؤال ${currentIdx + 1} من ${totalQ}`;
        document.getElementById('next-button').style.display = 'none';
        
        const progressPercent = (currentIdx / totalQ) * 100;
        document.getElementById('progress-line').style.width = `${progressPercent}%`;

        const q = questions[currentIdx];
        const container = document.getElementById('question-container');
        
        let optionsHtml = '';
        q.options.forEach((opt, idx) => {
            optionsHtml += `<div class="option" onclick="checkAnswer(this, ${idx})">${opt}</div>`;
        });

        container.innerHTML = `
            <div class="question-box active">
                <div class="question-text">${q.q}</div>
                <div class="options-list">${optionsHtml}</div>
            </div>
        `;
    }

    function checkAnswer(selectedElement, choiceIndex) {
        const q = questions[currentIdx];
        const options = selectedElement.parentElement.getElementsByClassName('option');
        
        for (let opt of options) {
            opt.style.pointerEvents = 'none';
        }

        if (choiceIndex === q.correct) {
            selectedElement.classList.add('correct');
            score++;
        } else {
            selectedElement.classList.add('wrong');
            options[q.correct].classList.add('correct');
        }
        
        document.getElementById('next-button').style.display = 'inline-block';
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
            renderQuestion();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        document.getElementById('progress-line').style.width = `100%`;
        document.getElementById('quiz-window').style.display = 'none';
        document.getElementById('results-window').style.display = 'block';
        document.getElementById('final-score').innerText = score;
        
        const feedback = document.getElementById('feedback-text');
        const percent = (score / questions.length) * 100;

        if (percent >= 80) {
            feedback.innerText = "أداء ممتاز ورائع! مستواك أسطوري في فهم تبويبات وتنسيقات برنامج Excel. 🦅";
        } else if (percent >= 50) {
            feedback.innerText = "عمل جيد! لقد نجحت في المراجعة بنجاح، وستساعدك الإعادة على التميز الكامل في مسابقة الترقية.";
        } else {
            feedback.innerText = "تحتاج لمراجعة تبويبات إكسيل والفرق بين الأدوات مرة أخرى بتركيز أعلى. بالتوفيق! 📊";
        }
    }

    window.onload = renderQuestion;
</script>

</body>
  </html>
